[project]
name = "tg-assistant-bot"
version = "0.1.0"
description = "Telegram personal operating system bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.6.0",
  "SQLAlchemy==2.0.30",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "APScheduler==3.10.4",
  "matplotlib==3.9.0",
  "pydantic-settings==2.3.4",
  "python-dateutil==2.9.0.post0",
  "dateparser==1.2.0",
  "lxml==5.2.2",
  "orjson==3.10.3",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.1",
  "pytest-asyncio==0.23.7",
  "coverage==7.5.3",
  "httpx==0.27.0",
  "ruff==0.4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
